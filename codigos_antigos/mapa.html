<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa e Rotas - Carona Universitária</title>

    <link rel="stylesheet" href="../css/style.css">
    <style>
    
        #map {
            height: 500px;
            width: 100%;
            margin-top: 20px;

        <h1>Mapa de Rotas</h1>
