<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar veículo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    main { max-width: 400px; margin: 0 auto; background: white; padding: 20px; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; background: #1f5fbf; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Cadastrar veículo</h1>

    <form method="post" action="">
      {% csrf_token %}

      <label for="modelo">Modelo</label>
      <input type="text" id="modelo" name="modelo" required>

      <label for="cor">Cor</label>
      <input type="text" id="cor" name="cor" required>

      <label for="placa">Placa</label>
      <input type="text" id="placa" name="placa" maxlength="7" required>

      <label for="vagas">Número de vagas</label>
      <input type="number" id="vagas" name="vagas" min="1" max="6" required>

      <button type="submit">Salvar</button>
    </form>
  </main>
</body>
</html>
