<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportar problema</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    main { max-width: 400px; margin: 0 auto; background: white; padding: 20px; }
    label { display: block; margin-top: 12px; }
    select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; background: #1f5fbf; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Reportar problema</h1>

    <form method="post" action="">
      {% csrf_token %}

      <label for="tipo">Tipo de problema</label>
      <select id="tipo" name="tipo" required>
        <option value="">Selecione</option>
        <option value="comportamento">Comportamento inadequado</option>
        <option value="nao_realizada">Carona não realizada</option>
        <option value="erro_app">Erro no app</option>
      </select>

      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" rows="5" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>
</body>
</html>
