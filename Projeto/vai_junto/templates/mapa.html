{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa e Rotas - Carona Universitária</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/mapa.css' %}">
</head>
<body>
    <header>
        <h1>Mapa de Rotas</h1>
        <nav>
            <a href="{% url 'rotas' %}">Ver rotas disponíveis</a>
        </nav>
    </header>

    <main>
        <section class="busca-mapa">
          <h2>Encontre uma rota</h2>
          <p>Pesquise as caronas cadastradas por bairro ou ponto de origem.</p>
          <form action="{% url 'rotas' %}" method="get">
            <label for="autocomplete">Ponto de origem</label>
            <input type="search" id="autocomplete" name="q" placeholder="Ex.: Centro">
            <button type="submit">Buscar rotas</button>
          </form>
        </section>
    </main>

</body>
</html>
