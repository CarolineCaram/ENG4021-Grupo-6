<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>vaijunto</title>

  <link rel="stylesheet" href="css/rota.css">
</head>

<body>

  <div class="caixa">
    <h2>vaijunto</h2>
    <h1>Configuração de rota</h1>
    <p>Informe seu trajeto para encontrarmos estudantes com caminhos parecidos.</p>

    <label>Origem</label>
    <input type="text" placeholder="Seu bairro ou endereço">

    <label>Destino</label>
    <input type="text" placeholder="Sua faculdade">

    <label>Horário de saída</label>
    <input type="time">

    <label>Dias da semana</label>
    <div class="dias">
      <span>Seg</span>
      <span>Ter</span>
      <span>Qua</span>
      <span>Qui</span>
      <span>Sex</span>
    </div>

    <button>Buscar caronas</button>
  </div>

</body>
</html>
