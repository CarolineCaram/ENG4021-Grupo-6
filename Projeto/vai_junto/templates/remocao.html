<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>vaijunto</title>

  <link rel="stylesheet" href="css/remocao.css">
</head>

<body>

  <div class="caixa">
    <h2>vaijunto</h2>
    <h1>Remover conta</h1>
    <p>Sentimos muito que você queira sair. Esta ação é permanente e não pode ser desfeita.</p>

    <div class="aviso">
      Ao remover sua conta, seu perfil, suas rotas e seu histórico de caronas serão apagados definitivamente.
    </div>

    <label>Confirme sua senha</label>
    <input type="password" placeholder="Digite sua senha">

    <label>
      <input type="checkbox"> Entendo que esta ação é irreversível
    </label>

    <button class="btn-remover">Remover minha conta</button>
    <button class="btn-cancelar">Cancelar</button>
  </div>

</body>
</html>
