{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>vaijunto</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F8FAFC;
      color: #172554;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .caixa {
      background-color: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 40px;
      width: 360px;
      text-align: center;
    }

    h2 {
      color: #2563EB;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
    }

    .foto {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #2563EB;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin: 10px auto 6px;
    }

    .verificado {
      color: #22C55E;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .dado {
      text-align: left;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }

    .dado .titulo {
      font-size: 12px;
      color: #64748B;
    }

    .dado .valor {
      font-size: 15px;
      font-weight: bold;
    }

    button {
      width: 100%;
      background-color: #2563EB;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      margin-top: 12px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="caixa">
    <h2>vaijunto</h2>
    <h1>Meu perfil</h1>

    <div class="foto">MC</div>
    <div class="verificado">Matrícula verificada</div>

    <div class="dado">
      <div class="titulo">Nome completo</div>
      <div class="valor">Maria Clara Oliveira</div>
    </div>

    <div class="dado">
      <div class="titulo">Número de matrícula</div>
      <div class="valor">2510227</div>
    </div>

    <div class="dado">
      <div class="titulo">Universidade</div>
      <div class="valor">PUC-Rio</div>
    </div>

    <div class="dado">
      <div class="titulo">Curso</div>
      <div class="valor">Engenharia de Produção</div>
    </div>

    <button>Editar perfil</button>
  </div>

</body>
</html>
