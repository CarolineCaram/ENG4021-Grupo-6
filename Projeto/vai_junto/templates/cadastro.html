{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vaijunto</title>

  <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
</head>

<body>

  <div class="caixa">
    <h2>vaijunto</h2>
    <h1>Criar sua conta</h1>
    <p>Cadastre-se para encontrar e oferecer caronas com estudantes da sua faculdade.</p>

    {% if erro %}
      <p style="color:#b91c1c;font-weight:bold">{{ erro }}</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <label for="nome">Nome completo</label>
      <input id="nome" type="text" name="nome" placeholder="Seu nome" value="{{ dados.nome }}" required>

      <label for="email">E-mail</label>
      <input id="email" type="email" name="email" placeholder="seu@email.com" value="{{ dados.email }}" required>

      <label for="instituicao">Universidade</label>
      <select id="instituicao" name="instituicao" required>
        <option value="">Selecione sua universidade</option>
        {% for i in instituicoes %}
          <option value="{{ i.id_instituicao }}" {% if dados.instituicao == i.id_instituicao|stringformat:"s" %}selected{% endif %}>{{ i.sigla }} - {{ i.nome }}</option>
        {% endfor %}
      </select>

      <label for="matricula">Matrícula</label>
      <input id="matricula" type="text" name="matricula" placeholder="Ex: 2022100234" value="{{ dados.matricula }}" required>

      <label for="senha">Senha</label>
      <input id="senha" type="password" name="senha" placeholder="Mínimo 8 caracteres" minlength="8" required>

      <label for="confirmar">Confirmar senha</label>
      <input id="confirmar" type="password" name="confirmar" placeholder="Repita a senha" required>

      <label for="origem">Ponto de origem</label>
      <input id="origem" type="text" name="origem" placeholder="Seu bairro" value="{{ dados.origem }}" required>

      <label for="referencia">Endereço ou referência (opcional)</label>
      <input id="referencia" type="text" name="referencia" placeholder="Ex: Próximo ao metrô" value="{{ dados.referencia }}">

      <label for="horario">Horário de saída</label>
      <input id="horario" type="time" name="horario" value="{{ dados.horario }}" required>

      <label for="transporte">Meio de transporte</label>
      <select id="transporte" name="transporte">
        <option value="Carro">Carro</option>
        <option value="Moto">Moto</option>
        <option value="Passageiro">Passageiro</option>
        <option value="Van">Van / Micro-ônibus</option>
        <option value="Bicicleta">Bicicleta</option>
      </select>

      <label for="vagas">Vagas disponíveis</label>
      <input id="vagas" type="number" name="vagas" min="0" max="8" value="2">

      <button type="submit">Cadastrar</button>
    </form>

    <p>Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
  </div>

</body>
</html>
