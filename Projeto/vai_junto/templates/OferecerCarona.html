<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>vaijunto</title>

  <link rel="stylesheet" href="css/OferecerCarona.css">
</head>

<body>

  <div class="caixa">
    <h2>vaijunto</h2>
    <h1>Oferecer carona</h1>
    <p>Cadastre o trajeto que você vai fazer e divida o caminho com outros estudantes.</p>

    <label>Origem</label>
    <input type="text" placeholder="Seu bairro ou endereço">

    <label>Destino</label>
    <input type="text" placeholder="Sua faculdade">

    <label>Horário de saída</label>
    <input type="time">

    <label>Vagas disponíveis</label>
    <select>
      <option>1 vaga</option>
      <option>2 vagas</option>
      <option>3 vagas</option>
      <option>4 vagas</option>
    </select>

    <label>Tipo de veículo</label>
    <select>
      <option>Carro</option>
      <option>Moto</option>
      <option>Van</option>
    </select>

    <label>Observações (opcional)</label>
    <textarea placeholder="Ex.: passo pela Barra, só levo mochila pequena..."></textarea>

    <button>Oferecer carona</button>
  </div>

</body>
</html>
