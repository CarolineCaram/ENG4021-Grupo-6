{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oferecer carona · vaijunto</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/OferecerCarona.css' %}">
</head>

<body>

  <div class="caixa">
    <h2>vaijunto</h2>
    <h1>Oferecer carona</h1>
    <p>Cadastre o trajeto que você vai fazer e divida o caminho com outros estudantes.</p>

    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="origem">Origem</label>
      <input id="origem" name="origem" type="text" value="{{ dados.origem }}" placeholder="Seu bairro" required>
      <label for="instituicao">Faculdade de destino</label>
      <select id="instituicao" name="instituicao" required>
        <option value="">Selecione sua faculdade</option>
        {% for instituicao in instituicoes %}
          <option value="{{ instituicao.id_instituicao }}">{{ instituicao.sigla }} — {{ instituicao.nome }}</option>
        {% endfor %}
      </select>
      <label for="horario">Horário de saída</label>
      <input id="horario" name="horario" type="time" value="{{ dados.horario }}" required>
      <label for="vagas">Vagas disponíveis</label>
      <input id="vagas" name="vagas" type="number" min="1" max="8" value="{{ dados.vagas|default:1 }}" required>
      <label for="transporte">Transporte</label>
      <select id="transporte" name="transporte">
        <option value="Carro">Carro</option><option value="Moto">Moto</option><option value="Van">Van</option>
      </select>
      <label for="referencia">Ponto de referência (opcional)</label>
      <input id="referencia" name="referencia" type="text" value="{{ dados.referencia }}">
      <button type="submit">Publicar rota</button>
    </form>
    <p><a href="{% url 'rotas' %}">Voltar às rotas</a></p>
  </div>

</body>
</html>
