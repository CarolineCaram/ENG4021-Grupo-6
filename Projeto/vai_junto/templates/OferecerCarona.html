{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>vaijunto</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F8FAFC;
      color: #172554;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .caixa {
      background-color: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 40px;
      width: 360px;
      text-align: center;
    }

    h2 {
      color: #2563EB;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
    }

    p {
      color: #64748B;
      font-size: 14px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    textarea {
      resize: none;
      height: 60px;
    }

    button {
      width: 100%;
      background-color: #2563EB;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      margin-top: 24px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="caixa">
    <h2>vaijunto</h2>
    <h1>Oferecer carona</h1>
    <p>Cadastre o trajeto que você vai fazer e divida o caminho com outros estudantes.</p>

    <label>Origem</label>
    <input type="text" placeholder="Seu bairro ou endereço">

    <label>Destino</label>
    <input type="text" placeholder="Sua faculdade">

    <label>Horário de saída</label>
    <input type="time">

    <label>Vagas disponíveis</label>
    <select>
      <option>1 vaga</option>
      <option>2 vagas</option>
      <option>3 vagas</option>
      <option>4 vagas</option>
    </select>

    <label>Tipo de veículo</label>
    <select>
      <option>Carro</option>
      <option>Moto</option>
      <option>Van</option>
    </select>

    <label>Observações (opcional)</label>
    <textarea placeholder="Ex.: passo pela Barra, só levo mochila pequena..."></textarea>

    <button>Oferecer carona</button>
  </div>

</body>
</html>
