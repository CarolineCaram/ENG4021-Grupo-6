{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar – Vaijunto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Página_Inicio.css">
</head>

<body>
  <main class="pagina">

    <section class="lado-info">
      <a class="logo" href="Tela_Login.html">
        <img src="logo.png" alt="Vaijunto – caronas universitárias">
      </a>

      <div class="chamada">
        <h1>Sua carona começa aqui</h1>
        <p>Entre na sua conta para ver as rotas disponíveis e conectar com outros estudantes da sua faculdade.</p>
      </div>

      <small class="copyright">© 2026 Vaijunto</small>
    </section>

    <section class="lado-form">
      <div class="form-box">
        <h2>Bem-vindo de volta</h2>
        <p class="subtitulo">Entre com seus dados de acesso</p>

        <form id="form-login">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="seu@email.com" required>

          <label for="senha">Senha</label>
          <input id="senha" type="password" placeholder="Sua senha" required>

          <p id="mensagem-erro" class="erro"></p>

          <button type="submit">Entrar</button>
        </form>

        <p class="cadastro">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      </div>
    </section>

  </main>

  <script src="login.js"></script>
</body>
</html>
