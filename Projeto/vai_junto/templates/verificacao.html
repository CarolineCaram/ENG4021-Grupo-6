<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>vaijunto</title>

  <link rel="stylesheet" href="css/verificacao.css">
</head>

<body>

  <div class="caixa">
    <h2>vaijunto</h2>
    <h1>Verificação de matrícula</h1>
    <p>Confirme seu vínculo com a universidade para garantir a segurança da comunidade.</p>

    <label>Universidade</label>
    <select>
      <option>Selecione sua universidade</option>
      <option>PUC-Rio</option>
      <option>UFF</option>
      <option>UFRJ</option>
      <option>Outra</option>
    </select>

    <label>Número de matrícula (RA)</label>
    <input type="text" placeholder="Ex.: 2510227">

    <label>CPF</label>
    <input type="text" placeholder="000.000.000-00">

    <button>Verificar matrícula</button>
  </div>

</body>
</html>
