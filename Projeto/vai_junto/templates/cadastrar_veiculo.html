{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar veículo</title>
  <link rel="stylesheet" href="{% static 'css/cadastrar_veiculo.css' %}">
</head>
<body>
  <main>
    <h1>Cadastrar veículo</h1>

    <form method="post" action="">
      {% csrf_token %}

      <label for="modelo">Modelo</label>
      <input type="text" id="modelo" name="modelo" required>

      <label for="cor">Cor</label>
      <input type="text" id="cor" name="cor" required>

      <label for="placa">Placa</label>
      <input type="text" id="placa" name="placa" maxlength="7" required>

      <label for="vagas">Número de vagas</label>
      <input type="number" id="vagas" name="vagas" min="1" max="6" required>

      <button type="submit">Salvar</button>
    </form>
  </main>
</body>
</html>
